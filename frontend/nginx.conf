# 静态资源 + /api 反代（compose 内走服务名）。
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # 检测上传可能较大
        client_max_body_size 60m;
    }
}
